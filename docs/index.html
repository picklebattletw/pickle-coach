<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>匹克球教練筆記</title>
<meta name="description" content="給匹克球教練的學生、課表、收費與學習紀錄管理工具，資料存在你自己的 Google 雲端硬碟。">
<meta name="theme-color" content="#1E5D78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="教練筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: mobile-first app shell — sticky header, single column, bottom tab bar; court-blue ink with a ball-yellow accent */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E6ECEA; --line:#D3DCD9;
  --ink:#14242B; --muted:#5A6B70; --court:#1E5D78; --court-soft:#DCEAF0;
  --ball:#E9B824; --ball-soft:#FBF0CC; --good:#2E7D55; --good-soft:#DDF0E5;
  --warn:#B86E12; --warn-soft:#FBEBD5; --bad:#B23A3A; --bad-soft:#F6DEDE;
  --on-court:#FFFFFF;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1F; --surface:#17252C; --sunk:#1F3039; --line:#2C4049;
  --ink:#E7EFF1; --muted:#97A9AE; --court:#7FC0DB; --court-soft:#1D3A47;
  --ball:#F0C744; --ball-soft:#3A3217; --good:#6FCB98; --good-soft:#1B3628;
  --warn:#EBA55A; --warn-soft:#3D2C17; --bad:#EC8A8A; --bad-soft:#3F2022; --on-court:#0F1A1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#17252C; --sunk:#1F3039; --line:#2C4049;
  --ink:#E7EFF1; --muted:#97A9AE; --court:#7FC0DB; --court-soft:#1D3A47;
  --ball:#F0C744; --ball-soft:#3A3217; --good:#6FCB98; --good-soft:#1B3628;
  --warn:#EBA55A; --warn-soft:#3D2C17; --bad:#EC8A8A; --bad-soft:#3F2022; --on-court:#0F1A1F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{width:30px;height:30px;flex:none}
.brand{font-weight:900;letter-spacing:.02em;font-size:16px;line-height:1.2;min-width:0}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.busy{background:var(--ball)} .dot.off{background:var(--warn)} .dot.err{background:var(--bad)}
h1{font-size:26px;font-weight:900;margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:15px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .more{margin-left:auto}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--court);font-weight:700;margin:14px 0 4px}
.sub{color:var(--muted);margin:4px 0 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--court-soft);color:var(--court)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:480px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-family:var(--f-num);font-size:clamp(15px,4.1vw,22px);font-weight:600;display:block;white-space:nowrap;line-height:1.25}
.stat small{font-size:11px;color:var(--muted);display:block;min-height:1.2em}
.list{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.lesson:hover{border-color:var(--court)}
.lesson .time{border-right:3px solid var(--court);padding-right:8px}
.lesson .time b{font-family:var(--f-num);font-size:20px;font-weight:600;display:block;line-height:1.1}
.lesson .time span{font-family:var(--f-num);color:var(--muted);font-size:14px}
.lesson.done .time{border-color:var(--good)} .lesson.cancelled{opacity:.55} .lesson.cancelled .time{border-color:var(--muted)}
.ltitle{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who,.loc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--court-soft);color:var(--court);white-space:nowrap;display:inline-block}
.tag.ball{background:var(--ball-soft);color:var(--warn)} .tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.mute{background:var(--sunk);color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;width:100%;text-align:left}
.row:hover{border-color:var(--court)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:700}
.row .main small{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.av{width:38px;height:38px;border-radius:50%;background:var(--court-soft);color:var(--court);display:grid;place-items:center;font-weight:900;flex:none}
.right{text-align:right;flex:none}
.right b{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1;display:block}
.right small{font-size:11px;color:var(--muted)}
.right.low b{color:var(--warn)} .right.neg b{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--court)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--court);border-color:var(--court);color:var(--on-court)}
.btn.cta{background:var(--ball);border-color:var(--ball);color:#14242B}
.btn.line{background:#06C755;border-color:#06C755;color:#fff}
.btn.danger{color:var(--bad)} .btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 10px}
.weekbar{display:flex;align-items:center;gap:8px;margin-top:12px}
.weekbar .t{flex:1;text-align:center;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;text-align:center;cursor:pointer}
.day small{display:block;font-size:11px;color:var(--muted)}
.day b{font-family:var(--f-num);font-size:18px;font-weight:600}
.day i{display:block;height:8px;font-style:normal;line-height:8px;color:var(--court);font-size:9px}
.day.sel{background:var(--court);border-color:var(--court);color:var(--on-court)} .day.sel small,.day.sel i{color:var(--on-court)}
.day.today:not(.sel){border-color:var(--ball);border-width:2px}
.dayhead{font-weight:700;margin:18px 0 8px;font-size:14px;color:var(--muted)}
.dayhead.is-today{color:var(--court)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.back{background:none;border:0;color:var(--court);font-weight:700;padding:12px 0 0;cursor:pointer}
.profile{display:flex;gap:14px;align-items:center;margin-top:8px}
.profile .av{width:56px;height:56px;font-size:22px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.radarwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:560px){.radarwrap{grid-template-columns:1fr}}
.radar{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);justify-content:center;margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 22px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;background:var(--court);border-radius:4px}
.bar .v{font-family:var(--f-num);font-weight:600;text-align:right}
.timeline{position:relative;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:-19px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--court)}
.tl.att::before{border-color:var(--muted);width:10px;height:10px;left:-18px;border-width:2px}
.tl .d{font-size:12px;color:var(--muted);font-family:var(--f-num);font-weight:600;letter-spacing:.04em}
.tl .d .sub2{font-family:var(--f-body);font-weight:400;letter-spacing:0}
.tl .c{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px;cursor:pointer}
.tl .c p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.lab{font-size:12px;color:var(--court);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.chip.on{background:var(--court);color:var(--on-court);border-color:var(--court)}
textarea.msg{width:100%;min-height:260px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);line-height:1.6;resize:vertical}
.cat{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.cat .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.cat .fill{height:100%;border-radius:5px}
.tx{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;width:100%;text-align:left}
.tx .main{flex:1;min-width:0}
.tx .main small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.amt{font-family:var(--f-num);font-weight:600;font-size:18px;white-space:nowrap}
.amt.in{color:var(--good)} .amt.out{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left}
.menu button:hover{border-color:var(--court)}
.menu b{font-size:16px}
.menu small{color:var(--muted);font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--court)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;width:54px;height:54px;border-radius:50%;border:0;background:var(--ball);color:#14242B;font-size:28px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:-14px;background:var(--bg);padding:8px 0;z-index:1}
.sheet .hd h3{margin:0;font-size:18px;flex:1}
.x{background:var(--sunk);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px}
.f{display:flex;flex-direction:column;gap:4px;margin-top:12px;min-width:0}
.f label,.f .lb{font-size:13px;font-weight:700;color:var(--muted)}
.f input:not([type=checkbox]):not([type=radio]):not([type=range]),.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.priceg{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:0 8px}
.priceg .f label{font-size:12px}
.priceg .f input{padding:10px 6px!important;text-align:center}
.pricerow{margin-top:10px}
.pricerow>.lb{font-size:13px;font-weight:700;color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.pick input:checked+span{background:var(--court);color:var(--on-court);border-color:var(--court)}
.pick input:focus-visible+span{outline:2px solid var(--ball)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--ink)}
.att{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.att b{flex:1;font-weight:500;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--court);color:var(--on-court)}
.seg input[value=noshow]:checked+span{background:var(--bad);color:#fff}
.seg input[value=leave]:checked+span{background:var(--warn);color:#fff}
.fold{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.fold>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.sk{display:grid;grid-template-columns:96px minmax(0,1fr) 22px;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.sk input{width:100%;accent-color:var(--court)}
.sk output{font-family:var(--f-num);font-weight:700;font-size:18px;text-align:right}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .grow{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
/* sign-in screen */
.gate{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px}
.gate .ball{width:64px;height:64px}
.gate .brandlogo{display:block;width:min(300px,82%);height:auto;margin:0 auto;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.gate h1{font-size:30px;margin-top:16px}
.gate ul{padding:0;list-style:none;margin:20px 0;display:flex;flex-direction:column;gap:10px}
.gate li{display:flex;gap:10px;align-items:flex-start}
.gate li b{display:block}
.gate li small{color:var(--muted)}
.gate li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ball);margin-top:7px;flex:none;box-shadow:inset 0 0 0 2px var(--court)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:16px}
.gbtn svg{width:20px;height:20px}
.fine{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
.fine a{color:var(--court)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="shell" hidden>
<header class="top"><div class="in">
  <img class="logo" src="mark.png" alt="" width="30" height="30">
  <div class="brand">匹克球教練筆記<small id="brandSub"></small></div>
  <div class="sp"></div>
  <button class="sync" id="sync" type="button"><span class="dot"></span><span></span></button>
</div></header>
<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="主選單"><div class="in" id="tabs">

<script>
/* ================== 設定（部署時只需要改這裡） ================== */
const CONFIG = {
  APP_NAME: '匹克球教練筆記',
  // 到 Google Cloud Console 建立「OAuth 用戶端 ID（網頁應用程式）」後貼在這裡
  GOOGLE_CLIENT_ID: '1077129293968-bf6dib39uopauv90j3l9107ardu57290.apps.googleusercontent.com',
  DRIVE_FOLDER: '匹克球教練筆記',
  // 舊版用過的資料夾名稱，改名前就在用的人要能繼續找到自己的資料
  LEGACY_FOLDERS: ['匹克球教練本'],
  DRIVE_FILE: 'coach-data.json',
  PRIVACY_URL: 'privacy.html',
  VERSION: '1.4.2'
};
const SCOPES = 'https://www.googleapis.com/auth/drive.file openid email profile';
const DRIVE = 'https://www.googleapis.com/drive/v3';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

/* ================== 常數 ================== */
const SKILLS=[['serve','發球'],['return','接發球'],['dink','小球 Dink'],['drop','第三拍吊球'],['drive','抽球'],['volley','截擊'],['footwork','步法'],['strategy','戰術判斷']];
const PAYTYPES={single:['課程收費','in'],income:['其他收入','in'],venue:['場地費','out'],gear:['器材','out'],expense:['其他支出','out']};
const payType=t=>PAYTYPES[t]||['其他','in'];
const ATTLABEL={present:'出席',leave:'請假',noshow:'未到'};
/* 價目表：每人每堂費用 = 課程性質（一般課／體驗課）× 上課人數（1對1～1對4） */
const PRICEKIND={normal:'一般課',trial:'體驗課'};
// 一般課依 1對1～1對4，體驗課依 4～8 人；填的都是「整堂總價」
const PRICEHEADS={normal:[1,2,3,4],trial:[4,5,6,7,8]};
const headLabel=(k,h)=>k==='trial'?`${h} 人`:`1對${h}`;
const DEFAULT_PRICES={normal:{1:1000,2:1400,3:1800,4:2000},trial:{4:2000,5:2500,6:3000,7:3500,8:4000}};
const METHODS=['現金','轉帳','LINE Pay','街口支付','其他'];
const SOURCES=['朋友介紹','Instagram','Facebook','LINE 社群','體驗課','球場現場','其他'];
const LEADST={inquiry:['詢問中','mute'],trial:['已約體驗','ball'],won:['已成交','good'],lost:['未成交','bad']};
const COLORS=['#1E5D78','#2E7D55','#B86E12','#B23A3A','#6B4FA0','#0F8A8A','#A0527A','#5A6B70'];
const COLS=['students','lessons','payments','logs','leads'];
const DEFAULT_SETTINGS={coachName:'',brand:'',defaultLocation:'',defaultDuration:60,inactiveDays:21,singlePrice:1000,prices:null,updatedAt:0};

/* ================== 小工具 ================== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const parse=s=>{const[y,m,d]=String(s||'').split('-').map(Number);return new Date(y||2000,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const WD='日一二三四五六';
const dlabel=s=>{if(!s)return '';const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`};
const toMin=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m};
const endTime=(t,m)=>{const x=toMin(t)+Number(m||60);return pad(Math.floor(x/60)%24)+':'+pad(x%60)};
const money=n=>'NT$'+Math.round(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtNum=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(_){}};

/* ================== 資料 ================== */
// 補上預設值；舊資料沒有價目表時，用原本的「單堂制預設單價」當 1對1 一般課的價格
function fillSettings(s){
  const o={...DEFAULT_SETTINGS,...(s||{})};
  const base=Number(o.singlePrice)>0?Number(o.singlePrice):DEFAULT_PRICES.normal[1];
  const src=o.prices&&typeof o.prices==='object'?o.prices:{normal:{...DEFAULT_PRICES.normal,1:base},trial:{...DEFAULT_PRICES.trial}};
  o.prices={};
  for(const k of Object.keys(PRICEKIND)){o.prices[k]={};for(const n of PRICEHEADS[k]){const v=Number(src[k]?.[n]||0);o.prices[k][n]=v>0?Math.round(v):0}}
  return o;
}
function emptyData(){return {schema:1,settings:fillSettings(),students:{},lessons:{},payments:{},logs:{},leads:{}}}
let D=emptyData();
const all=col=>Object.values(D[col]||{}).filter(r=>r&&!r.deleted);
const byId=(col,id)=>{const r=id&&D[col]?.[id];return r&&!r.deleted?r:null};
const SET=()=>fillSettings(D.settings);
const coachSign=()=>{const s=SET();return s.coachName?`— ${s.coachName}`:''};
const brandName=()=>SET().brand||CONFIG.APP_NAME;

function put(col,id,data){const o={...data,id,updatedAt:Date.now()};delete o.deleted;D[col][id]=o;changed();return o}
function del(col,id){if(D[col][id])D[col][id]={id,deleted:true,updatedAt:Date.now()};changed()}
function putSettings(s){D.settings={...SET(),...s,updatedAt:Date.now()};changed()}

function normalize(x){
  const d=emptyData();if(!x||typeof x!=='object')return d;
  for(const c of COLS){const v=x[c];if(Array.isArray(v))v.forEach(r=>{if(r&&r.id)d[c][r.id]=r});else if(v&&typeof v==='object')for(const[k,r]of Object.entries(v))if(r)d[c][k]={...r,id:r.id||k}}
  d.settings=fillSettings(x.settings);return d;
}
function merge(a,b){
  const out=emptyData();
  for(const c of COLS){const ids=new Set([...Object.keys(a[c]||{}),...Object.keys(b[c]||{})]);
    for(const id of ids){const x=a[c]?.[id],y=b[c]?.[id];out[c][id]=!x?y:!y?x:((y.updatedAt||0)>(x.updatedAt||0)?y:x)}}
  out.settings=fillSettings((b.settings?.updatedAt||0)>(a.settings?.updatedAt||0)?b.settings:a.settings);
  // 刪除超過 90 天的標記，避免檔案越長越大
  const cut=Date.now()-90*864e5;
  for(const c of COLS)for(const[id,r]of Object.entries(out[c]))if(r.deleted&&(r.updatedAt||0)<cut)delete out[c][id];
  return out;
}

/* ================== 計算 ================== */
/* ---- 課程收費 ---- */
const feeKindOf=l=>l&&l.feeKind==='trial'?'trial':'normal';
// 收費人數：有自己填就用填的（體驗課常有還沒建檔的人），否則用這堂的學生人數
const headsOf=l=>{const m=Math.round(Number((l&&l.payHeads)||0));return m>0?Math.min(m,99):Math.max(1,((l&&l.studentIds)||[]).length)};
// 計價用的人數：夾在該課程性質的級距內（體驗課最少以 4 人計）
const billHeads=(l)=>{const hs=PRICEHEADS[feeKindOf(l)];return Math.min(Math.max(headsOf(l),hs[0]),hs[hs.length-1])};
// 查價目表，回傳「整堂總價」
function totalPriceFor(kind,heads){
  const st=SET(),k=PRICEKIND[kind]?kind:'normal',hs=PRICEHEADS[k],P=(st.prices||{})[k]||{};
  const h=Math.min(Math.max(Math.round(Number(heads)||hs[0]),hs[0]),hs[hs.length-1]),i=hs.indexOf(h);
  for(let j=i;j>=0;j--){const v=Number(P[hs[j]]||0);if(v>0)return v}       // 先往人數少的找
  for(let j=i+1;j<hs.length;j++){const v=Number(P[hs[j]]||0);if(v>0)return v} // 再往人數多的找
  return Number(st.singlePrice||0);
}
// 這堂每人的價格：課程自己填的價格最優先（不同場地／特殊情況），否則查價目表
// 這堂自己填的總價（0＝沒填）；unitPrice 是舊版的「每人價格」，換算回總價
const ownTotal=l=>Number(l?.feeTotal)>0?Number(l.feeTotal):Number(l?.unitPrice)>0?Number(l.unitPrice)*headsOf(l):0;
const lessonFee=l=>Math.round(ownTotal(l)||totalPriceFor(feeKindOf(l),billHeads(l))); // 整堂總價
// 這位學生這堂應收：課程自訂總價 > 學生個人單價 > 價目表總價 ÷ 人數
function studentFee(l,s){
  const own=ownTotal(l);
  if(own>0)return Math.round(own/Math.max(1,headsOf(l)));
  if(Number(s?.price)>0)return Math.round(Number(s.price));
  return Math.round(totalPriceFor(feeKindOf(l),billHeads(l))/Math.max(1,headsOf(l)));
}
const perHead=l=>Math.round(lessonFee(l)/Math.max(1,headsOf(l)));          // 平均每人
const counted=(l,sid)=>l.status!=='cancelled'&&l.deduct!==false&&['present','noshow'].includes((l.attendance||{})[sid]);
const lessonsOf=sid=>all('lessons').filter(l=>(l.studentIds||[]).includes(sid));
const doneCount=sid=>lessonsOf(sid).filter(l=>(l.attendance||{})[sid]==='present').length; // 已上課堂數
const paysOf=sid=>all('payments').filter(p=>p.studentId===sid).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function owed(s){ // 待收款＝已點名計費的課 − 已收的課程費
  if(!s)return 0;
  const due=lessonsOf(s.id).filter(l=>counted(l,s.id)).reduce((a,l)=>a+studentFee(l,s),0);
  const paid=all('payments').filter(p=>p.studentId===s.id&&p.type==='single').reduce((a,p)=>a+Number(p.amount||0),0);
  return Math.round(due-paid);
}
function lastAttended(sid){const l=lessonsOf(sid).filter(l=>(l.attendance||{})[sid]==='present').sort((a,b)=>b.date.localeCompare(a.date))[0];return l?.date||''}
function nextLesson(sid){return lessonsOf(sid).filter(l=>l.date>=today()&&l.status==='scheduled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]}
const lessonsOn=d=>all('lessons').filter(l=>l.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const logsOf=sid=>all('logs').filter(l=>l.studentId===sid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const sname=id=>byId('students',id)?.name||'（已刪除）';
const names=l=>(l.studentIds||[]).map(sname).join('、')||'尚未指定學生';
const activeStudents=()=>all('students').filter(s=>(s.status||'active')==='active');
function monthSum(m){let inc=0,exp=0;all('payments').filter(p=>(p.date||'').startsWith(m)).forEach(p=>{payType(p.type)[1]==='out'?exp+=Number(p.amount||0):inc+=Number(p.amount||0)});return{inc,exp}}
function sColor(s){return s?.color||COLORS[0]}
const initial=n=>esc(String(n||'?').replace(/^範例・/,'').slice(0,1));

/* ================== 帳號、本機快取與同步 ================== */
// session: {mode:'google'|'demo', email, name, picture}
let session=lsGet('pcb:session');
let store={fileId:'',folderId:'',remoteVersion:'',editSeq:0,syncedSeq:0};
let token=null,tokenExp=0,syncState='idle',syncMsg='',pushTimer=null,syncing=false,syncAgain=false;
const storeKey=()=>session?.mode==='google'?'pcb:acct:'+session.email:'pcb:demo';

function saveLocal(){lsSet(storeKey(),{data:D,fileId:store.fileId,folderId:store.folderId,remoteVersion:store.remoteVersion,dirty:store.editSeq!==store.syncedSeq})}
function loadLocal(){
  const x=lsGet(storeKey());
  if(x){D=normalize(x.data);store.fileId=x.fileId||'';store.folderId=x.folderId||'';store.remoteVersion=x.remoteVersion||'';store.editSeq=x.dirty?1:0;store.syncedSeq=0}
  else{D=emptyData();store={fileId:'',folderId:'',remoteVersion:'',editSeq:0,syncedSeq:0}}
}
function changed(){store.editSeq++;saveLocal();render();if(session?.mode==='google'){clearTimeout(pushTimer);pushTimer=setTimeout(sync,1500)}}

function setSync(st,msg){syncState=st;syncMsg=msg||'';const n=document.getElementById('sync');if(!n)return;
  const t={idle:'',ok:'已同步',busy:'同步中…',off:'點此連線',err:'同步失敗',demo:'試用模式'}[st]||'';
  n.innerHTML=`<span class="dot ${st==='demo'?'':st}"></span><span>${esc(t)}</span>`;n.title=msg||t}

function loadGIS(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('gis'));document.head.appendChild(s)})}
const clientReady=()=>!/PASTE_YOUR_CLIENT_ID/.test(CONFIG.GOOGLE_CLIENT_ID);

async function getToken(interactive){
  if(token&&Date.now()<tokenExp)return token;
  if(!clientReady())throw {code:'noclient'};
  await loadGIS();
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:SCOPES,login_hint:session?.email||'',
      callback:r=>{if(r.error)return rej({code:'auth',detail:r.error});token=r.access_token;tokenExp=Date.now()+(Number(r.expires_in||3600)-120)*1000;res(token)},
      error_callback:e=>rej({code:'auth',detail:e?.type})});
    c.requestAccessToken({prompt:interactive==='consent'?'consent':''});
  });
}
async function gfetch(url,opt={}){
  if(!token||Date.now()>=tokenExp)throw {code:'auth'};
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}});
  if(r.status===401){token=null;throw {code:'auth'}}
  if(!r.ok)throw {code:'http',status:r.status};
  return r;
}
async function driveFind(q){const r=await gfetch(`${DRIVE}/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id,name,version,modifiedTime)&orderBy=modifiedTime desc`);return (await r.json()).files||[]}
async function ensureFile(){
  if(store.fileId){try{await gfetch(`${DRIVE}/files/${store.fileId}?fields=id,trashed`).then(r=>r.json()).then(m=>{if(m.trashed)store.fileId=''})}catch(e){if(e.code==='http')store.fileId='';else throw e}}
  if(store.fileId)return store.fileId;
  let folder;
  for(const nm of [CONFIG.DRIVE_FOLDER,...(CONFIG.LEGACY_FOLDERS||[])]){
    folder=(await driveFind(`name='${nm}' and mimeType='application/vnd.google-apps.folder' and trashed=false`))[0];
    if(folder)break;
  }
  if(!folder){folder=await (await gfetch(`${DRIVE}/files?fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:CONFIG.DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})})).json()}
  store.folderId=folder.id;
  let file=(await driveFind(`name='${CONFIG.DRIVE_FILE}' and '${folder.id}' in parents and trashed=false`))[0];
  if(!file){
    const b='pcb'+Date.now(),meta={name:CONFIG.DRIVE_FILE,parents:[folder.id],mimeType:'application/json',description:CONFIG.APP_NAME+' 的資料檔，請勿手動修改'};
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(D)}\r\n--${b}--`;
    file=await (await gfetch(`${UPLOAD}/files?uploadType=multipart&fields=id,version`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();
    store.remoteVersion=String(file.version);
  }
  store.fileId=file.id;saveLocal();return file.id;
}
async function sync(opts={}){
  if(session?.mode!=='google')return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('busy');
  try{
    if(opts.interactive)await getToken(opts.interactive);
    else if(!token||Date.now()>=tokenExp){setSync('off','需要重新連線 Google');return}
    const id=await ensureFile();
    const meta=await (await gfetch(`${DRIVE}/files/${id}?fields=version`)).json();
    let pulled=false;
    if(String(meta.version)!==String(store.remoteVersion)){
      const txt=await (await gfetch(`${DRIVE}/files/${id}?alt=media`)).text();
      let remote={};try{remote=JSON.parse(txt||'{}')}catch(_){remote={}}
      const rem=normalize(remote);
      D=merge(D,rem);store.remoteVersion=String(meta.version);pulled=true;
      if(JSON.stringify(D)!==JSON.stringify(merge(rem,rem)))store.editSeq++; // 本機有雲端沒有的資料，合併後寫回
    }
    if(store.editSeq!==store.syncedSeq){
      const seq=store.editSeq;
      const r=await (await gfetch(`${UPLOAD}/files/${id}?uploadType=media&fields=version`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)})).json();
      store.remoteVersion=String(r.version);store.syncedSeq=seq;
    }
    saveLocal();setSync('ok','最後同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
    if(pulled)render();
  }catch(e){
    if(e?.code==='auth'){setSync('off','需要重新連線 Google')}
    else if(e?.code==='noclient'){setSync('err','尚未設定 Google 用戶端 ID')}
    else{setSync('err',e?.status?`Google 回應錯誤（${e.status}）`:'網路連線有問題，資料先存在這台裝置')}
  }finally{syncing=false;if(syncAgain){syncAgain=false;setTimeout(sync,300)}}
}
async function signInGoogle(){
  try{
    if(!clientReady()){toast('這個網站還沒設定 Google 登入金鑰，請先用試用模式');return}
    await getToken('consent');
    const info=await (await gfetch('https://www.googleapis.com/oauth2/v3/userinfo')).json();
    session={mode:'google',email:info.email,name:info.name||'',picture:info.picture||''};
    lsSet('pcb:session',session);loadLocal();
    if(!SET().coachName&&info.name){D.settings={...SET(),coachName:info.given_name||info.name}}
    boot();await sync();
    if(!all('students').length&&!all('lessons').length)ui.tab='today';render();
  }catch(e){
    if(e?.code==='auth')toast('沒有完成 Google 登入，請再試一次');
    else toast('登入失敗，請確認網路後再試');
  }
}
function startDemo(){session={mode:'demo'};lsSet('pcb:session',session);loadLocal();if(!all('students').length)seedDemo();boot()}
function signOut(){
  if(token&&window.google?.accounts?.oauth2)try{google.accounts.oauth2.revoke(token,()=>{})}catch(_){}
  token=null;session=null;lsDel('pcb:session');D=emptyData();closeSheet();showGate();
}

/* ================== 畫面狀態 ================== */
const ui={tab:'today',sub:null,sid:null,week:weekStart(today()),day:today(),month:today().slice(0,7),q:'',sfilter:'active',tagf:'',ntype:'remind',nref:'',leadf:'open'};
let msgDirty=false;

function render(){
  if(!session)return;
  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  const app=document.getElementById('app');if(!app)return;
  let v;
  if(ui.tab==='more'){v={msg:vMsg,leads:vLeads,stats:vStats,settings:vSettings}[ui.sub]||vMore}
  else v={today:vToday,cal:vCal,stu:vStu,money:vMoney}[ui.tab];
  const keep=ui.tab==='more'&&ui.sub==='msg'&&msgDirty?document.getElementById('msgText')?.value:null;
  app.innerHTML=banners()+v();
  if(keep!=null){const ta=document.getElementById('msgText');if(ta)ta.value=keep}

function stLabel(l){

function stuRow(s,right,sub){

function remainRight(s){
  const o=owed(s),n=doneCount(s.id);

  if(o<0)return `<div class="right"><b>${money(-o)}</b><small>已預繳</small></div>`;
  return `<div class="right"><b>${n}</b><small>已上課</small></div>`;
}

    const la=lastAttended(s.id);
    if(la&&!nextLesson(s.id)){const d=diffDays(la,t);if(d>=st.inactiveDays)out.push({s,kind:'idle',txt:`${d} 天沒上課，也沒有排下一堂`,tag:'mute',rank:2})}
  });

}

/* ---------- 行事曆 ---------- */

function radarSVG(cur,base){
  const cx=160,cy=128,R=88,n=SKILLS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/5;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g='';
  for(let k=1;k<=5;k++)g+=`<polygon points="${SKILLS.map((_,i)=>pt(i,k).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  SKILLS.forEach((s,i)=>{const[x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;const[lx,ly]=pt(i,6.15);g+=`<text x="${lx}" y="${ly}" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="var(--muted)">${s[1]}</text>`});
  const poly=(o,stroke,fill,dash)=>`<polygon points="${SKILLS.map((s,i)=>pt(i,Number(o[s[0]]||0)).join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash?'stroke-dasharray="4 4"':''}/>`;
  if(base)g+=poly(base,'var(--muted)','none',true);
  g+=poly(cur,'var(--court)','var(--court-soft)');
  g+=SKILLS.map((s,i)=>{const[x,y]=pt(i,Number(cur[s[0]]||0));return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--ball)" stroke="var(--court)" stroke-width="1.5"/>`}).join('');
  return `<svg class="radar" viewBox="0 0 320 256" role="img" aria-label="技術雷達圖">${g}</svg>`;
}

  <div class="profile"><div class="av" style="background:${sColor(s)}22;color:${sColor(s)}">${initial(s.name)}</div><div style="min-width:0"><h1>${esc(s.name)} ${st}</h1>

/* ---------- 收支 ---------- */

  const max=Math.max(1,...Object.values(cats));
  const ym=d=>{const x=new Date(y,mo-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)};
  const done=all('lessons').filter(l=>l.date.startsWith(m)&&l.status!=='cancelled'&&l.date<=today()).length;

/* ---------- 分析 ---------- */
function vStats(){
  const t=today(),months=[...Array(6)].map((_,i)=>{const d=parse(t);d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.getFullYear()+'-'+pad(d.getMonth()+1)});
  const sums=months.map(m=>monthSum(m));
  const maxV=Math.max(1000,...sums.map(s=>Math.max(s.inc,s.exp)));
  const W=320,H=170,L=44,B=24,bw=(W-L-8)/6;
  const nice=(()=>{const raw=maxV/4,p=10**Math.floor(Math.log10(raw)),s=[1,2,2.5,5,10].find(x=>x*p>=raw)*p;return s})();
  const top=nice*4,yv=v=>H-B-(v/top)*(H-B-10);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近六個月收支">`;
  for(let i=0;i<=4;i++){const v=nice*i,y=yv(v);svg+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y}" font-size="10" text-anchor="end" dominant-baseline="middle" fill="var(--muted)">${v>=10000?(v/10000)+'萬':v.toLocaleString()}</text>`}
  months.forEach((m,i)=>{const x=L+i*bw+bw*.18,w=bw*.3;const s=sums[i];
    svg+=`<rect x="${x}" y="${yv(s.inc)}" width="${w}" height="${H-B-yv(s.inc)}" rx="2" fill="var(--good)"/><rect x="${x+w+2}" y="${yv(s.exp)}" width="${w}" height="${H-B-yv(s.exp)}" rx="2" fill="var(--bad)" opacity=".75"/>`;
    svg+=`<text x="${L+i*bw+bw/2}" y="${H-8}" font-size="11" text-anchor="middle" fill="${m===t.slice(0,7)?'var(--ink)':'var(--muted)'}">${Number(m.slice(5))}月</text>`});
  svg+='</svg>';
  const since=addDays(t,-90);
  const marks=[];all('lessons').filter(l=>l.date>=since&&l.date<=t&&l.status!=='cancelled').forEach(l=>Object.values(l.attendance||{}).forEach(v=>marks.push(v)));
  const rate=marks.length?Math.round(marks.filter(v=>v==='present').length/marks.length*100):null;
  const year=t.slice(0,4),byMonth={};all('lessons').filter(l=>l.date.startsWith(year)&&l.status!=='cancelled').forEach(l=>{const k=l.date.slice(0,7);byMonth[k]=(byMonth[k]||0)+1});
  const busiest=Object.entries(byMonth).sort((a,b)=>b[1]-a[1])[0];
  const lessonInc=all('payments').filter(p=>p.date?.startsWith(year)&&p.type==='single').reduce((a,p)=>a+Number(p.amount||0),0);
  let heads=0;all('lessons').filter(l=>l.date.startsWith(year)).forEach(l=>(l.studentIds||[]).forEach(sid=>{if(counted(l,sid))heads++}));
  const perSession=heads?lessonInc/heads:0;
  const dueAll=activeStudents().reduce((a,s)=>a+Math.max(0,owed(s)),0);
  const rank={};all('payments').filter(p=>p.studentId&&payType(p.type)[1]==='in').forEach(p=>rank[p.studentId]=(rank[p.studentId]||0)+Number(p.amount||0));
  const top5=Object.entries(rank).filter(([id])=>byId('students',id)).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const rmax=Math.max(1,...top5.map(x=>x[1]));
  const src={};all('leads').forEach(l=>{const k=l.source||'未填';src[k]=src[k]||{n:0,w:0,c:0};src[k].n++;if(l.status==='won')src[k].w++;if(['won','lost'].includes(l.status))src[k].c++});
  all('students').filter(s=>s.source&&!all('leads').some(l=>l.studentId===s.id)).forEach(s=>{const k=s.source;src[k]=src[k]||{n:0,w:0,c:0}});
  const stuSrc={};all('students').forEach(s=>{const k=s.source||'未填';stuSrc[k]=(stuSrc[k]||0)+1});
  const smax=Math.max(1,...Object.values(stuSrc));
  return `${subBack}<p class="eyebrow">分析</p><h1>${year} 年經營概況</h1>
  <div class="stats four"><div class="stat"><span>出席率</span><b>${rate===null?'—':rate+'%'}</b><small>近 90 天</small></div><div class="stat"><span>每人次均價</span><b>${perSession?money(perSession):'—'}</b><small>今年收入 ÷ 人次</small></div><div class="stat"><span>待收款合計</span><b style="color:${dueAll>0?'var(--bad)':'inherit'}">${money(dueAll)}</b><small>上課中的學生</small></div><div class="stat"><span>最忙月份</span><b>${busiest?Number(busiest[0].slice(5))+' 月':'—'}</b><small>${busiest?busiest[1]+' 堂':'&nbsp;'}</small></div></div>
  <h2>近六個月收支</h2><div class="card">${svg}<div class="legend"><span><i style="background:var(--good)"></i>收入</span><span><i style="background:var(--bad)"></i>支出</span></div></div>
  <p class="hint">今年課程收入合計 ${money(lessonInc)}</p>
  <h2>學生繳費排行</h2>${top5.length?`<div class="card" style="display:flex;flex-direction:column;gap:8px">${top5.map(([id,v],i)=>`<div class="cat"><span>${i+1}. ${esc(sname(id))}</span><div class="track"><div class="fill" style="width:${v/rmax*100}%;background:var(--court)"></div></div><span class="num" style="font-weight:600">${money(v)}</span></div>`).join('')}</div>`:'<div class="empty">還沒有繳費紀錄</div>'}
  <h2>學生來源</h2>${all('students').length?`<div class="card" style="display:flex;flex-direction:column;gap:8px">${Object.entries(stuSrc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cat"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/smax*100}%;background:var(--ball)"></div></div><span class="num" style="font-weight:600">${v} 位</span></div>`).join('')}</div>`:'<div class="empty">還沒有學生</div>'}
  <h2>各來源成交率</h2>${Object.values(src).some(x=>x.n)?`<div class="list">${Object.entries(src).filter(([,x])=>x.n).sort((a,b)=>b[1].n-a[1].n).map(([k,x])=>`<div class="row" style="cursor:default"><div class="main"><b>${esc(k)}</b><small>${x.n} 位潛在客群，成交 ${x.w} 位</small></div><div class="right"><b>${x.c?Math.round(x.w/x.c*100)+'%':'—'}</b><small>成交率</small></div></div>`).join('')}</div>`:'<div class="empty">到「潛在客群」記錄詢問和體驗課的人，這裡就會算出各來源的成交率</div>'}`;
}

/* ---------- LINE 訊息 ---------- */
const stars=v=>'●'.repeat(v)+'○'.repeat(5-v);
function buildMsg(){
  const t=ui.ntype,ref=ui.nref,B=brandName(),sign=coachSign();
  if(t==='remind'){const l=byId('lessons',ref);if(!l)return '';
    return `【${B} 上課提醒】\n${names(l)} 您好！\n提醒您的課程時間：\n📅 ${dlabel(l.date)} ${l.time}–${endTime(l.time,l.duration)}\n📍 ${l.location||'（地點另行通知）'}\n🏓 ${l.title||'匹克球課'}\n\n請攜帶球拍、水和毛巾，提早 10 分鐘到場暖身。\n如需請假，請在課前 24 小時告知，謝謝！\n\n${sign}`.trim()}
  if(t==='week'){const ws=ui.week,we=addDays(ws,6);const ls=all('lessons').filter(l=>l.date>=ws&&l.date<=we&&l.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    if(!ls.length)return `【${B} 本週課表】${dlabel(ws)}–${dlabel(we)}\n本週暫無課程。`;
    return (`【${B} 本週課表】\n${dlabel(ws)} – ${dlabel(we)}\n\n`+ls.map(l=>{const open=l.type==='group'?Math.max(0,Number(l.capacity||4)-(l.studentIds||[]).length):null;return `${dlabel(l.date)} ${l.time}　${l.title||'匹克球課'}${l.location?'｜'+l.location:''}${open===null?'':open?`（剩 ${open} 位）`:'（額滿）'}`}).join('\n')+`\n\n想報名團體課請直接回覆，額滿為止！\n${sign}`).trim()}
  if(t==='feedback'){const g=byId('logs',ref);if(!g)return '';const s=byId('students',g.studentId);
    const prev=logsOf(g.studentId).find(x=>x.id!==g.id&&((x.date||'')<(g.date||'')||(x.date===g.date&&(x.createdAt||0)<(g.createdAt||0))));
    const up=prev?SKILLS.filter(([k])=>Number(g.skills?.[k]||0)>Number(prev.skills?.[k]||0)).map(([k,n])=>`${n} ${prev.skills?.[k]||0}→${g.skills[k]}`):[];
    return `【今日學習回饋】\n${s?.name||''} 您好，今天辛苦了！\n📅 ${dlabel(g.date)}\n\n🏓 本堂重點：${g.focus||'—'}\n${up.length?`📈 進步項目：${up.join('、')}\n`:''}${g.note?`📝 教練觀察：${g.note}\n`:''}${g.homework?`🏠 回家練習：${g.homework}\n`:''}\n下次見！${sign}`.trim()}
  if(t==='owe'){const s=byId('students',ref);if(!s)return '';const o=owed(s),nl=nextLesson(s.id),f=logsOf(s.id)[0]?.focus;
    const when=nl?`${dlabel(nl.date)} ${nl.time}–${endTime(nl.time,nl.duration)}`:'';
    return `${s.name} 您好！\n跟您核對一下課程費用：${when?`目前預約 ${when} 的課程，`:''}尚有 ${money(Math.max(0,o))} 未結。\n${f?`這陣子在「${f}」進步很明顯，繼續保持！`:''}`.trim()}
  if(t==='report'){const s=byId('students',ref);if(!s)return '';const ls=logsOf(s.id),g=ls[0],f=ls.length>1?ls[ls.length-1]:null;
    let txt=`【學習報告】${s.name}\n${s.goal?`目標：${s.goal}\n`:''}累計上課：${doneCount(s.id)} 堂｜學習紀錄：${ls.length} 筆\n`;
    if(g){txt+=`\n技術評估（${dlabel(g.date)}）\n`+SKILLS.map(([k,n])=>{const v=Number(g.skills?.[k]||0),b=f?Number(f.skills?.[k]||0):null;return `${n}　${stars(v)}${b!==null&&v>b?`  ↑${v-b}`:''}`}).join('\n');if(g.homework)txt+=`\n\n下一階段練習：${g.homework}`}
    return (txt+`\n\n${sign}`).trim()}
  if(t==='trial'){const l=byId('leads',ref);if(!l)return '';const st=SET(),tp=Math.round(totalPriceFor('trial',PRICEHEADS.trial[0])/PRICEHEADS.trial[0]);
    return `${l.name} 您好！歡迎來體驗匹克球 🏓\n\n📅 ${l.trialDate?dlabel(l.trialDate):'（時間確認中）'}${l.trialTime?' '+l.trialTime:''}\n📍 ${st.defaultLocation||'（地點另行通知）'}\n${tp>0?`💰 體驗課 ${money(tp)}／人（多人同行另有優惠）\n`:''}\n請穿運動鞋、帶水，球拍現場可借用。\n有任何問題都可以直接回覆這則訊息！\n${sign}`.trim()}
  if(t==='custom')return `【${B} 公告】\n\n\n${sign}`;
  return '';
}
function vMsg(){
  const types=[['remind','課前提醒'],['week','本週課表'],['feedback','課後回饋'],['owe','收款提醒'],['report','學習報告'],['trial','體驗課邀約'],['custom','自訂公告']];
  let pick='';
  const sel=(label,opts)=>opts.length?`<div class="f"><label for="nref">${label}</label><select id="nref" data-input="nref">${opts.map(([v,n])=>`<option value="${v}" ${v===ui.nref?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`:'';
  if(ui.ntype==='remind'){const ls=all('lessons').filter(l=>l.date>=addDays(today(),-1)&&l.status!=='cancelled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,40);
    if(!byId('lessons',ui.nref))ui.nref=ls[0]?.id||'';pick=sel('選擇課程',ls.map(l=>[l.id,`${dlabel(l.date)} ${l.time} ${l.title||''}｜${names(l)}`]))||'<div class="empty">沒有即將到來的課程</div>'}

    if(!byId('logs',ui.nref))ui.nref=gs[0]?.id||'';pick=sel('選擇學習紀錄',gs.map(g=>[g.id,`${dlabel(g.date)}｜${sname(g.studentId)}｜${g.focus||''}`]))||'<div class="empty">還沒有學習紀錄</div>'}

  return `${subBack}<p class="eyebrow">LINE 訊息</p><h1>訊息產生器</h1><p class="sub">系統自動帶入學生、時間和學習內容。可以先修改文字，再傳到 LINE 個人或群組。</p>

  ${pick}
  <div class="f"><label for="msgText">訊息內容（可直接編輯）</label><textarea class="msg" id="msgText">${esc(buildMsg())}</textarea></div>
  <div class="actions"><a class="btn line grow" id="lineLink" href="#" target="_blank" rel="noopener">用 LINE 傳送</a><button class="btn grow" data-act="copy">複製文字</button></div>
  <p class="hint">「用 LINE 傳送」會開啟 LINE，讓你選好友或群組。如果沒有反應，請按「複製文字」再貼到 LINE。</p>`;
}

// 排課表單裡即時顯示這堂的收費（改人數、時長、課程性質時會重算）
function feeInfo(){
  const f=document.getElementById('sf'),box=document.getElementById('l_feeinfo');if(!f||!box)return;
  const kind=document.getElementById('l_fee')?.value==='trial'?'trial':'normal';
  const manual=Math.round(Number(document.getElementById('l_heads')?.value||0));
  const n=manual>0?manual:Math.max(1,f.querySelectorAll('input[name="sids"]:checked').length);
  const own=Math.max(0,Math.round(Number(document.getElementById('l_price')?.value||0)));
  const l={feeKind:kind,payHeads:n,feeTotal:own,duration:Number(document.getElementById('l_dur')?.value||60)};
  const bh=billHeads(l),tot=lessonFee(l);
  box.textContent=`${PRICEKIND[kind]} ${headLabel(kind,bh)}：整堂 ${money(tot)}，平均每人 ${money(perHead(l))}。`
    +(own>0?'這堂是自訂總價，不受價目表影響。':bh!==n?`（${PRICEKIND[kind]}價目表最少 ${PRICEHEADS[kind][0]} 人起算）`:'')
    +(own>0?'':'價格可到「更多 › 設定 › 課程價目表」調整，或在上面直接填這堂的總價。');
}

function paymentSheet(id,preset={}){
  const s=preset.sid?byId('students',preset.sid):null;
  const p=id?byId('payments',id):{type:preset.type||'single',studentId:preset.sid||'',date:today(),method:'轉帳',amount:s?Math.max(0,owed(s)):''};

function download(filename,text,type){
  try{const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  catch(_){toast('這個瀏覽器無法下載檔案')}
}
function ics(l){
  const dt=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const e=s=>String(s||'').replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PickleCoach//ZH','BEGIN:VEVENT',`UID:${l.id}@picklecoach`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART;TZID=Asia/Taipei:${dt(l.date,l.time)}`,`DTEND;TZID=Asia/Taipei:${dt(l.date,endTime(l.time,l.duration))}`,`SUMMARY:${e((l.title||'匹克球課')+'｜'+names(l))}`,`LOCATION:${e(l.location)}`,`DESCRIPTION:${e(l.note)}`,'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:上課提醒','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function csv(){
  const rows=[['日期','類別','收支','學生','金額','方式','備註']];
  all('payments').filter(p=>(p.date||'').startsWith(ui.month)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{const[n,d]=payType(p.type);rows.push([p.date,n,d==='in'?'收入':'支出',p.studentId?sname(p.studentId):'',p.amount,p.method||'',p.note||''])});
  return '﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{try{const x=normalize(JSON.parse(rd.result));const n=COLS.reduce((a,c)=>a+Object.keys(x[c]).length,0);if(!n)return toast('這個檔案裡沒有資料');
      for(const c of COLS)for(const r of Object.values(x[c]))r.updatedAt=Math.max(Number(r.updatedAt||0),Date.now());
      D=merge(D,x);changed();toast(`已匯入 ${n} 筆資料`)}catch(_){toast('檔案格式不正確，請選擇本系統下載的備份檔')}};
  rd.readAsText(file);
}

    case 'ics':{const l=byId('lessons',ds.id);if(l)download(`匹克球課_${l.date}.ics`,ics(l),'text/calendar');break}
    case 'export-csv':download(`收支_${ui.month}.csv`,csv(),'text/csv');break;
    case 'export-json':download(`${CONFIG.APP_NAME}_備份_${today()}.json`,JSON.stringify(D),'application/json');break;
    case 'del':{
      if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='再按一次確認刪除';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent='刪除'}},3000);break}
      del(ds.col,ds.id);if(ds.col==='students'&&ui.sid===ds.id)ui.sid=null;closeSheet();toast('已刪除');render();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.out){const o=document.getElementById(t.dataset.out);if(o)o.textContent=t.value}
  if(t.dataset.input==='q'){ui.q=t.value;if(!e.isComposing)render()}
  if(t.id==='msgText'){msgDirty=true;syncLineLink()}
  if(['l_heads','l_price'].includes(t.id))feeInfo();
});
document.addEventListener('compositionend',e=>{if(e.target.dataset?.input==='q'){ui.q=e.target.value;render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.input==='nref'){ui.nref=t.value;msgDirty=false;render()}
  if(t.id==='g_s'){document.getElementById('g_l').innerHTML=lessonOptsHtml(t.value,'');const pv=logsOf(t.value)[0];
    SKILLS.forEach(([k])=>{const r=document.getElementById('sk_'+k);if(r){r.value=pv?.skills?.[k]||2;document.getElementById('o_'+k).textContent=r.value}})}
  if(t.id==='l_type'){const ti=document.getElementById('l_title');if(t.value==='group'&&ti.value==='一對一私人課')ti.value='初學團體班'}
  if(['l_fee','l_heads','l_price','l_dur'].includes(t.id)||t.name==='sids')feeInfo();
  if(t.id==='importFile'&&t.files[0]){importBackup(t.files[0]);t.value=''}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='setForm'){const fd=new FormData(e.target);const num=k=>Number(fv(fd,k)||0);
    const prices={};for(const k of Object.keys(PRICEKIND)){prices[k]={};for(const h of PRICEHEADS[k])prices[k][h]=Math.max(0,num(`price_${k}_${h}`))}
    putSettings({coachName:fv(fd,'coachName'),brand:fv(fd,'brand'),defaultLocation:fv(fd,'defaultLocation'),defaultDuration:num('defaultDuration')||60,prices,singlePrice:prices.normal[1]||SET().singlePrice,inactiveDays:num('inactiveDays')||21});toast('設定已儲存');return}
  if(e.target.id==='sf'&&sheetSubmit)sheetSubmit(new FormData(e.target));
});
document.getElementById('fab').addEventListener('click',()=>{
  if(ui.tab==='stu')return ui.sid?logSheet(null,{sid:ui.sid}):studentSheet();
  if(ui.tab==='money')return paymentSheet();
  if(ui.tab==='more'&&ui.sub==='leads')return leadSheet();
  lessonSheet(null,{d:ui.tab==='cal'?ui.day:undefined});
});
document.getElementById('sync').addEventListener('click',()=>{if(session?.mode==='google')sync({interactive:'silent'});else if(session?.mode==='demo')showGate()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session?.mode==='google'&&token)sync()});
setInterval(()=>{if(document.visibilityState==='visible'&&session?.mode==='google'&&token)sync()},120000);
// 日期跨日時更新畫面
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);

/* ================== 啟動 ================== */
if(session&&(session.mode==='demo'||session.email)){loadLocal();if(session.mode==='demo'&&!all('students').length)seedDemo();boot()}else showGate();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

</script>
</body>
</html>
